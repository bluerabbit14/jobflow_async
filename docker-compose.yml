version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management   # Official RabbitMQ image with management plugin
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP messaging port
      - "15672:15672"  # Web management console port
    environment:
      RABBITMQ_DEFAULT_USER: user   # default username
      RABBITMQ_DEFAULT_PASS: password # default password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # persistent data

volumes:
  rabbitmq_data:
